name: test

# Pull requests only: plugin code runs on every user's machine, so each change is tested before review.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2 as /bin/bash; put it first on PATH so the scripts run on the bash users have.
      - name: Use the system bash on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >>"$GITHUB_PATH"

      - name: Tool versions
        run: |
          bash --version | head -n 1
          git --version
          jq --version

      - name: Run tests
        run: tests/bats/bin/bats tests/team-memory
